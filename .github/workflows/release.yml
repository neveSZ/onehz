name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (the selected ref must be a version tag)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2)
          CODE=$(grep '^versionCode=' version.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "OneHZ $VERSION ($CODE)"

      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match version.properties ($VERSION)"
            exit 1
          fi

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ONEHZ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ONEHZ_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/onehz-release.jks"
          echo "ONEHZ_KEYSTORE_FILE=$RUNNER_TEMP/onehz-release.jks" >> "$GITHUB_ENV"

      - name: Build release
        env:
          ONEHZ_KEYSTORE_PASSWORD: ${{ secrets.ONEHZ_KEYSTORE_PASSWORD }}
          ONEHZ_KEY_ALIAS: ${{ secrets.ONEHZ_KEY_ALIAS }}
          ONEHZ_KEY_PASSWORD: ${{ secrets.ONEHZ_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)

          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          "$AAPT2" dump badging "$APK" | grep '^package:'

          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "${{ secrets.ONEHZ_CERT_SHA256 }}" | tr -d ':' | tr 'A-F' 'a-f')
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch"
            exit 1
          fi

          cp "$APK" "OneHZ-${VERSION}.apk"
          sha256sum "OneHZ-${VERSION}.apk" > "OneHZ-${VERSION}.apk.sha256"
          ls -lh "OneHZ-${VERSION}.apk"
          cat "OneHZ-${VERSION}.apk.sha256"

      - name: Prepare release notes
        run: |
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/release-notes.md"
            printf '# OneHZ %s\n\nSee CHANGELOG.md for details.\n' "$VERSION" > "$NOTES"
          fi
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneHZ-${{ env.VERSION }}
          path: |
            OneHZ-${{ env.VERSION }}.apk
            OneHZ-${{ env.VERSION }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.VERSION }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.publish == 'true')
        uses: softprops/action-gh-release@v2
        with:
          name: OneHZ ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_NOTES }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            OneHZ-${{ env.VERSION }}.apk
            OneHZ-${{ env.VERSION }}.apk.sha256

      - name: Clean up keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/onehz-release.jks" "$RUNNER_TEMP/apk.sha256" "$RUNNER_TEMP/signature.txt"
